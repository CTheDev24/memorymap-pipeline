name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "memorymap_pipeline/**"
      - "tests/**"
      - "memorymap-desktop.spec"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"
  pull_request:
    paths:
      - "memorymap_pipeline/**"
      - "tests/**"
      - "memorymap-desktop.spec"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and desktop packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,package,dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean memorymap-desktop.spec

      - name: Smoke-check packaged executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/MemoryMap.exe"
          if ((Get-Item $exe).Length -lt 1MB) {
            throw "Packaged executable is unexpectedly small."
          }

          $archive = & pyi-archive_viewer -r -b $exe 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller could not inspect the executable archive.`n$archive"
          }
          if ($archive -notmatch "osmnx-[^\\/]+\.dist-info[\\/]METADATA") {
            throw "The executable is missing OSMnx package metadata."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *MemoryMap.exe" | Set-Content -Encoding ascii "dist/MemoryMap.exe.sha256"
          Write-Host "MemoryMap.exe SHA-256: $hash"

      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MemoryMap-Windows-${{ github.sha }}
          path: |
            dist/MemoryMap.exe
            dist/MemoryMap.exe.sha256
          if-no-files-found: error
          retention-days: 14
