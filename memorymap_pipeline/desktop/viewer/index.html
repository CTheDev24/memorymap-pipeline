<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemoryMap 3D Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #20252b;
      color: #eef2f4;
    }
    html, body, #viewport { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; }
    .panel {
      position: absolute;
      z-index: 2;
      border: 1px solid #ffffff24;
      border-radius: 8px;
      background: #171b20e8;
      box-shadow: 0 4px 18px #0007;
      backdrop-filter: blur(6px);
    }
    #toolbar {
      top: 12px;
      left: 12px;
      display: flex;
      gap: 6px;
      padding: 7px;
    }
    button {
      border: 1px solid #ffffff2b;
      border-radius: 5px;
      padding: 6px 10px;
      background: #2a3138;
      color: inherit;
      cursor: pointer;
    }
    button:hover { background: #38434d; }
    #layers { top: 62px; left: 12px; min-width: 150px; padding: 10px 12px; }
    #layers strong { display: block; margin-bottom: 6px; }
    #layers label { display: block; padding: 2px 0; }
    #info { right: 12px; bottom: 12px; padding: 9px 12px; font-size: 12px; line-height: 1.45; }
    #status {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 520px;
      padding: 14px 18px;
      text-align: center;
    }
    #help { left: 12px; bottom: 12px; padding: 7px 10px; color: #c7d0d6; font-size: 11px; }
    .error { color: #ff9b87; }
  </style>
</head>
<body>
  <div id="viewport"></div>
  <div id="toolbar" class="panel">
    <button data-camera="perspective" title="Perspective view">Perspective</button>
    <button data-camera="top" title="Top view">Top</button>
    <button data-camera="side" title="Side view">Side</button>
    <button id="fit" title="Fit the entire map in view">Fit model</button>
  </div>
  <div id="layers" class="panel"><strong>Layers</strong><div id="layer-list"></div></div>
  <div id="info" class="panel">No model loaded</div>
  <div id="status" class="panel">Loading 3D preview…</div>
  <div id="help" class="panel">Drag to rotate · Shift/right-drag to pan · Wheel to zoom</div>

  <script src="three.min.js"></script>
  <script src="OrbitControls.js"></script>
  <script src="GLTFLoader.js"></script>
  <script>
  (() => {
    "use strict";
    const viewport = document.getElementById("viewport");
    const status = document.getElementById("status");
    const info = document.getElementById("info");
    const layerList = document.getElementById("layer-list");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x252b31);

    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10000);
    // MemoryMap and Trimesh export in Z-up coordinates; retain that convention.
    camera.up.set(0, 0, 1);
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({antialias: true, powerPreference: "high-performance"});
    } catch (error) {
      status.classList.add("error");
      status.textContent = "3D preview requires WebGL, which is unavailable on this system. " +
        "The generated 3MF is still available.";
      return;
    }
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    viewport.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.screenSpacePanning = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x4a5158, 1.8));
    const key = new THREE.DirectionalLight(0xffffff, 1.25);
    key.position.set(-1, 1.5, 2);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.55);
    fill.position.set(1, -1, 0.5);
    scene.add(fill);

    let model = null;
    let modelBox = null;
    let modelCenter = new THREE.Vector3();
    let modelSize = new THREE.Vector3(1, 1, 1);
    const layerObjects = new Map();

    function resize() {
      const width = viewport.clientWidth || 1;
      const height = viewport.clientHeight || 1;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }

    function classify(name) {
      const value = (name || "").toLowerCase();
      if (value.includes("route")) return "Route";
      if (value.includes("road")) return "Roads";
      if (value.includes("building")) return "Buildings";
      if (value.includes("water")) return "Water";
      if (value.includes("landscape") || value.includes("green")) return "Landscape";
      if (value.includes("terrain")) return "Terrain";
      if (value.includes("base") || value.includes("bone")) return "Base";
      return "Other";
    }

    function buildLayerControls() {
      layerList.replaceChildren();
      const order = ["Route", "Roads", "Buildings", "Water", "Landscape", "Terrain", "Base", "Other"];
      order.filter(name => layerObjects.has(name)).forEach(name => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = true;
        input.addEventListener("change", () => {
          layerObjects.get(name).forEach(object => { object.visible = input.checked; });
        });
        label.append(input, " " + name);
        layerList.appendChild(label);
      });
    }

    function fitCamera(view = "perspective") {
      if (!modelBox) return;
      const radius = Math.max(modelSize.length() * 0.5, 0.1);
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.08;
      let direction;
      if (view === "top") direction = new THREE.Vector3(0, 0.0001, 1);
      else if (view === "side") direction = new THREE.Vector3(1, 0, 0.2);
      else direction = new THREE.Vector3(1, 1, 0.85);
      direction.normalize();
      camera.position.copy(modelCenter).addScaledVector(direction, distance);
      camera.near = Math.max(distance / 1000, 0.01);
      camera.far = Math.max(distance * 20, 1000);
      camera.updateProjectionMatrix();
      controls.target.copy(modelCenter);
      controls.update();
    }

    document.querySelectorAll("[data-camera]").forEach(button => {
      button.addEventListener("click", () => fitCamera(button.dataset.camera));
    });
    document.getElementById("fit").addEventListener("click", () => fitCamera("perspective"));

    function reportModel() {
      let triangles = 0;
      layerObjects.clear();
      model.traverse(object => {
        if (!object.isMesh) return;
        const geometry = object.geometry;
        triangles += geometry.index
          ? geometry.index.count / 3
          : (geometry.attributes.position ? geometry.attributes.position.count / 3 : 0);
        const layer = classify([object.name, object.parent && object.parent.name,
          object.material && object.material.name].filter(Boolean).join(" "));
        if (!layerObjects.has(layer)) layerObjects.set(layer, []);
        layerObjects.get(layer).push(object);
      });
      buildLayerControls();
      const format = value => Number(value).toFixed(1);
      info.innerHTML =
        `<strong>${format(modelSize.x)} × ${format(modelSize.y)} × ${format(modelSize.z)} mm</strong><br>` +
        `${Math.round(triangles).toLocaleString()} triangles · ${layerObjects.size} layer groups`;
    }

    const params = new URLSearchParams(window.location.search);
    const modelName = params.get("model") || "preview.glb";
    new THREE.GLTFLoader().load(
      modelName,
      gltf => {
        model = gltf.scene;
        scene.add(model);
        modelBox = new THREE.Box3().setFromObject(model);
        if (modelBox.isEmpty()) {
          status.classList.add("error");
          status.textContent = "The preview contains no visible geometry. The generated 3MF is still available.";
          scene.remove(model);
          model = null;
          return;
        }
        modelBox.getCenter(modelCenter);
        modelBox.getSize(modelSize);
        reportModel();
        fitCamera("perspective");
        status.hidden = true;
      },
      undefined,
      error => {
        status.classList.add("error");
        status.textContent = "3D preview could not be loaded. The generated 3MF is still available. " +
          (error && error.message ? error.message : String(error));
      }
    );

    window.addEventListener("resize", resize);
    resize();
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  })();
  </script>
</body>
</html>
